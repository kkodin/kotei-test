<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日報スマホ</title>
<link rel="icon" href="../nippou/icon-192.png">
<link rel="stylesheet" href="app.css?v=202611192141">
</head>
<body>
<!-- 工事日報のスマホ入力（2026-11-18 ユーザー：PC の作業日報と同じ中身をスマホで打てるように。タブで分ける・予定か報告か・全体工程からの入力支援・外注は会社から名前）
     2026-11-19：本物の日報（詳細日報と同じ 工程データ\日報\個人_<記入者>_<年月>.json）に書く（real.js）。マスタ・工程はサインインして読む（テストの置き場なら 99_テスト）。 -->
<header id="top">
  <button type="button" class="appTitle" data-appmenu title="押すとほかのアプリへ切り替え（同じ窓）">日報スマホ</button>
  <span id="ver" class="ver">スマホ 11/19 21:41（テスト）</span>
  <button type="button" id="bBack" class="hbtn" hidden title="作業報告カレンダー（工事日報）へ戻る">◀ 戻る</button>
  <button type="button" id="bPc" class="hbtn" title="PC 版（工事日報）で開く。この端末では、次からも PC 版で開きます（日報スマホを開くと戻ります）">PC版</button>
  <button type="button" id="bList" class="hbtn" title="このスマホで書いた日報（控え）">一覧</button>
</header>

<section id="signin" class="signin" hidden>
  <p>会社の Microsoft アカウントでサインインすると、現場・名簿・全体工程を読み、日報を書きます（PC の詳細日報・工事日報と同じ日報）。</p>
  <button id="bSignIn" type="button" class="pri">サインイン</button>
  <p><a id="aDemo" href="?demo">サインインせずに試す（作りものの名前）</a></p>
</section>

<main id="app" hidden>
  <div class="mode" id="mode" role="tablist" title="作業予定を書くか、完了報告を書くか">
    <button type="button" data-mode="予定" class="on">予定</button>
    <button type="button" data-mode="報告">報告</button>
  </div>
  <div class="cur" id="cur"></div>
  <div id="pane" class="pane"></div>
</main>

<!-- 下（親指の届く所）：保存のボタンとタブ。2026-11-19 ユーザー：タブは下に・左右に送れる・中身がわかるアイコン -->
<footer id="act" class="act" hidden>
  <div class="arow">
    <button type="button" id="bForm" class="sub small">作業日報の形で見る</button>
    <button type="button" id="bSave" class="pri small">保存する</button>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="kihon" class="on"><span class="ic">📋</span><span class="tl">基本</span></button>
    <button type="button" data-tab="sagyo"><span class="ic">📝</span><span class="tl">作業</span></button>
    <button type="button" data-tab="hito"><span class="ic">👷</span><span class="tl">作業員</span></button>
    <button type="button" data-tab="kikai"><span class="ic">🚜</span><span class="tl">機械</span></button>
    <button type="button" data-tab="zai"><span class="ic">🧱</span><span class="tl">材料</span></button>
    <button type="button" data-tab="gai"><span class="ic">🤝</span><span class="tl">外注</span></button>
    <button type="button" data-tab="car"><span class="ic">⛽</span><span class="tl">高速・燃料</span></button>
  </nav>
</footer>

<!-- 下から出る窓（ボタンは上にいつも出す。外を押しても閉じない） -->
<div id="sheet" class="sheet" hidden>
  <div class="shead"><b id="sTitle"></b><span class="sp"></span><button type="button" id="sOk" class="pri small">決める</button><button type="button" id="sClose" class="sub small">閉じる</button></div>
  <div id="sBody" class="sbody"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="../common/lib/msal-browser.min.js"></script>
<script src="../common/config.js?v=202611192141"></script>
<script src="../common/auth.js?v=202611192141"></script>
<script src="../common/store.js?v=202611192141"></script>
<script src="../common/apps.js?v=202611192141"></script>
<script src="../common/master.js?v=202611192141"></script>
<script src="../common/appmenu.js?v=202611192141"></script>
<script src="data.js?v=202611192141"></script>
<script src="real.js?v=202611192141"></script>
<script src="app.js?v=202611192141"></script>
</body>
</html>
