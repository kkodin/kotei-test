<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マスター</title>
<link rel="icon" href="../nippou/icon-192.png">
<link rel="stylesheet" href="app.css?v=202611211437">
</head>
<body>
<header id="bar">
  <button type="button" class="appTitle" data-appmenu title="ほかのアプリへ（同じ窓で開きます）">マスター</button>
  <span class="right">
    <span id="who" class="ver"></span>
    <span class="ver">マスター 11/21 14:37（テスト）</span>
  </span>
</header>

<section id="signin" class="signin" hidden>
  <p id="signinMsg">会社の Microsoft アカウントでサインインしてください。</p>
  <button id="bSignIn" type="button" class="pri">サインイン</button>
</section>

<main id="app" hidden>
  <nav class="kinds" id="kinds"></nav>
  <div class="tools">
    <div class="tabs" id="tabs">
      <button type="button" data-f="all" class="on">全部</button>
      <button type="button" data-f="fix">直した・足した</button>
      <button type="button" data-f="out">外した</button>
    </div>
    <input id="q" type="search" placeholder="名前・コードで探す" autocomplete="off">
    <button id="bAdd" type="button" class="pri">＋ 足す</button>
  </div>
  <p id="info" class="info"></p>
  <div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
</main>

<div id="dlg" class="dlg" hidden role="dialog" aria-modal="true">
  <div class="dwin" id="dwin">
    <div class="dhead" id="dhead"><b id="dTitle"></b><span class="dbtns"><button type="button" id="dClose">閉じる</button><button type="button" id="dSave" class="pri">直す</button></span></div>
    <form class="dbody" id="dlgBody" autocomplete="off"></form>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<!-- 共通の部品（設定・サインイン・読み書き・アプリの行き来・マスタ） -->
<script src="../common/lib/msal-browser.min.js"></script>
<script src="../common/config.js?v=202611211437"></script>
<script src="../common/auth.js?v=202611211437"></script>
<script src="../common/store.js?v=202611211437"></script>
<script src="../common/apps.js?v=202611211437"></script>
<script src="../common/appmenu.js?v=202611211437"></script>
<script src="../common/master.js?v=202611211437"></script>
<script src="app.js?v=202611211437"></script>
</body>
</html>
